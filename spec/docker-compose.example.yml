# One container, one named volume (docs/16 "Docker"). Build the image from
# the repository's Dockerfile until released images exist.
services:
  sinjal:
    build: .
    image: sinjal:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SINJAL_BASE_URL: "https://sinjal.example.com"
      # SINJAL_TRUSTED_PROXIES: "172.16.0.0/12"  # the reverse proxy's network
      # SINJAL_TIMEZONE: "Europe/Berlin"
    volumes:
      - sinjal-data:/data

volumes:
  sinjal-data:
