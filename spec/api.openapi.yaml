openapi: 3.1.0
info:
  title: Sinjal API
  version: 0.1.0
  description: Small automation/status API for Sinjal.
servers:
  - url: /
paths:
  /api/v1/status:
    get:
      summary: Get authenticated instance summary
      responses:
        '200':
          description: Instance summary
  /api/v1/monitors:
    get:
      summary: List monitors
      responses:
        '200':
          description: Monitor list
  /api/v1/monitors/{id}:
    get:
      summary: Get monitor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Monitor }
        '404': { description: Not found }
  /api/v1/monitors/{id}/pause:
    post:
      summary: Pause monitor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Paused }
  /api/v1/monitors/{id}/resume:
    post:
      summary: Resume monitor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Resumed }
  /api/v1/heartbeat/{token}:
    post:
      summary: Record heartbeat
      description: The body is ignored. GET is accepted too, for clients that cannot POST.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Recorded }
        '404': { description: Invalid token }
        '429': { description: Too many requests from this client address }
  /api/v1/heartbeat:
    post:
      summary: Record heartbeat, token in "Authorization: Bearer <token>"
      responses:
        '204': { description: Recorded }
        '404': { description: Missing or invalid token }
        '429': { description: Too many requests from this client address }
  /status/{slug}/api.json:
    get:
      summary: Public-safe status page JSON
      description: >
        Follows the page's access rules (also at /s/{token}/api.json and, on a
        mapped hostname, /api.json). Components and incidents carry opaque keys,
        never internal ids. A password or authenticated page answers 401 without
        its cookie or a session.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public status representation
          content:
            application/json:
              schema:
                type: object
                required: [page, overall_status, generated_at, uptime_90d, components, incidents]
                properties:
                  page:
                    type: object
                    required: [title]
                    properties: { title: { type: string }, description: { type: string } }
                  overall_status:
                    type: object
                    properties: { state: { type: string }, text: { type: string } }
                  generated_at: { type: string, format: date-time }
                  uptime_90d: { type: string }
                  components:
                    type: array
                    items:
                      type: object
                      required: [key, name, status, uptime_90d]
                      properties:
                        key: { type: string }
                        name: { type: string }
                        group: { type: string }
                        status: { type: string }
                        latency_ms: { type: integer }
                        uptime_90d: { type: string }
                  incidents:
                    type: array
                    items:
                      type: object
                      required: [key, component, active, started_at, notes]
                      properties:
                        key: { type: string }
                        component: { type: string, description: Key of the component }
                        active: { type: boolean }
                        started_at: { type: string, format: date-time }
                        ended_at: { type: string, format: date-time }
                        notes:
                          type: array
                          items:
                            type: object
                            properties: { at: { type: string, format: date-time }, message: { type: string } }
        '401': { description: The page needs its password or a session }
        '404': { description: Unknown page }
  /status/{slug}/feed.xml:
    get:
      summary: Incident feed (Atom)
      description: Same access rules as api.json (also at /s/{token}/feed.xml and /feed.xml on a mapped hostname).
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Atom feed, one entry per incident on the page
          content:
            application/atom+xml: {}
        '401': { description: The page needs its password or a session }
        '404': { description: Unknown page }
